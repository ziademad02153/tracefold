<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="712" viewBox="0 0 1200 712" role="img" aria-labelledby="title desc">
<title id="title">Tracefold product workflow</title><desc id="desc">Connect, prepare, generate and approve, execute, inspect evidence, then replay unchanged tests on a repaired revision.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#617269"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="712" rx="24" fill="#F5F7F2" stroke="none"/><text x="42" y="47" font-size="12" fill="#617269" font-weight="700" letter-spacing="2">THE PRODUCT WORKFLOW</text><text x="42" y="88" font-size="30" fill="#182B23" font-weight="700" >From repository to verified repair</text><rect x="42" y="137" width="344" height="203" rx="16" fill="white" stroke="#D7E0D7"/><rect x="64" y="159" width="39" height="32" rx="9" fill="#C3F76B" stroke="none"/><text x="83.5" y="181" font-size="15" fill="#182B23" font-weight="700" text-anchor="middle">01</text><text x="64" y="231" font-size="23" fill="#182B23" font-weight="700" >Connect project</text><text x="64" y="269" font-size="16" fill="#617269" font-weight="400" >Choose repository, revision</text><text x="64" y="294" font-size="16" fill="#617269" font-weight="400" >and the component to verify.</text><rect x="428" y="137" width="344" height="203" rx="16" fill="white" stroke="#D7E0D7"/><rect x="450" y="159" width="39" height="32" rx="9" fill="#C3F76B" stroke="none"/><text x="469.5" y="181" font-size="15" fill="#182B23" font-weight="700" text-anchor="middle">02</text><text x="450" y="231" font-size="23" fill="#182B23" font-weight="700" >Prepare environment</text><text x="450" y="269" font-size="16" fill="#617269" font-weight="400" >Select a runtime profile and</text><text x="450" y="294" font-size="16" fill="#617269" font-weight="400" >reproduce project dependencies.</text><rect x="814" y="137" width="344" height="203" rx="16" fill="white" stroke="#D7E0D7"/><rect x="836" y="159" width="39" height="32" rx="9" fill="#C3F76B" stroke="none"/><text x="855.5" y="181" font-size="15" fill="#182B23" font-weight="700" text-anchor="middle">03</text><text x="836" y="231" font-size="23" fill="#182B23" font-weight="700" >Generate &amp; approve</text><text x="836" y="269" font-size="16" fill="#617269" font-weight="400" >Define behavior. Review the code.</text><text x="836" y="294" font-size="16" fill="#617269" font-weight="400" >Approve an exact test suite.</text><rect x="814" y="398" width="344" height="203" rx="16" fill="white" stroke="#D7E0D7"/><rect x="836" y="420" width="39" height="32" rx="9" fill="#C3F76B" stroke="none"/><text x="855.5" y="442" font-size="15" fill="#182B23" font-weight="700" text-anchor="middle">04</text><text x="836" y="492" font-size="23" fill="#182B23" font-weight="700" >Run tests</text><text x="836" y="530" font-size="16" fill="#617269" font-weight="400" >Execute baseline and additions.</text><text x="836" y="555" font-size="16" fill="#617269" font-weight="400" >Keep provenance for each case.</text><rect x="428" y="398" width="344" height="203" rx="16" fill="white" stroke="#D7E0D7"/><rect x="450" y="420" width="39" height="32" rx="9" fill="#C3F76B" stroke="none"/><text x="469.5" y="442" font-size="15" fill="#182B23" font-weight="700" text-anchor="middle">05</text><text x="450" y="492" font-size="23" fill="#182B23" font-weight="700" >Inspect evidence</text><text x="450" y="530" font-size="16" fill="#617269" font-weight="400" >Understand failures, logs and</text><text x="450" y="555" font-size="16" fill="#617269" font-weight="400" >the execution that produced them.</text><rect x="42" y="398" width="344" height="203" rx="16" fill="#182B23" stroke="#D7E0D7"/><rect x="64" y="420" width="39" height="32" rx="9" fill="#C3F76B" stroke="none"/><text x="83.5" y="442" font-size="15" fill="#182B23" font-weight="700" text-anchor="middle">06</text><text x="64" y="492" font-size="23" fill="white" font-weight="700" >Verify repair</text><text x="64" y="530" font-size="16" fill="#D7E4D3" font-weight="400" >Replay the same approved suite.</text><text x="64" y="555" font-size="16" fill="#D7E4D3" font-weight="400" >Compare results on the repair.</text><path d="M386 238H418" fill="none" stroke="#617269" stroke-width="2" marker-end="url(#arrow)"/><path d="M772 238H804" fill="none" stroke="#617269" stroke-width="2" marker-end="url(#arrow)"/><path d="M986 340V388" fill="none" stroke="#617269" stroke-width="2" marker-end="url(#arrow)"/><path d="M814 499H782" fill="none" stroke="#617269" stroke-width="2" marker-end="url(#arrow)"/><path d="M428 499H396" fill="none" stroke="#617269" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="662" font-size="19" fill="#182B23" font-weight="600" >Same tests. New revision. Traceable results.</text></g></svg>