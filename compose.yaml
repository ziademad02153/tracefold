services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tracefold
      POSTGRES_USER: tracefold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
